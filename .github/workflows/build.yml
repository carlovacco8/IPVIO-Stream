name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # contents: write = publish the APK as a release (fixed public link for the TV's Downloader app)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Unit tests
        # A failing test is reported (see below) but does not stop the APK build
        continue-on-error: true
        shell: bash
        run: ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee test.log
      - name: Build debug APK
        shell: bash
        run: ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        with:
          name: ipvio-stream-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK as release "latest-build"
        # Public link that never changes:
        # https://github.com/<owner>/<repo>/releases/download/latest-build/IPVIO-Stream-DRM.apk
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          cp "$apk" IPVIO-Stream-DRM.apk
          gh release delete latest-build --cleanup-tag -y || true
          gh release create latest-build IPVIO-Stream-DRM.apk --target "$GITHUB_SHA" \
            --title "Latest build (DRM)" --notes "Debug build of commit $GITHUB_SHA. Installs next to the official app (package com.ipvio.stream.test)." --prerelease
      - name: Report errors as annotations
        # Logs need a sign-in; annotations are public, so the failing lines are readable from the run page.
        # Only reports, never fails the job itself.
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          for f in test.log build.log; do
            [ -f "$f" ] || continue
            lines=$(grep -E -A4 "FAILED|^e: |What went wrong|AssertionError|Exception:" "$f" | grep -v "^\s*at org\.\|^\s*at java\.\|^\s*at jdk\.\|^\s*at kotlin\." | head -60 || true)
            [ -z "$lines" ] && continue
            echo "$lines" | split -l 6 - chunk_
            n=0
            for c in chunk_*; do
              n=$((n+1)); [ $n -gt 9 ] && break
              msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$c")
              echo "::error title=$f part $n::$msg"
            done
            rm -f chunk_*
          done
          exit 0
